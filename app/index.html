<title>GTA ONE</title>
<meta name="description" content="GTA ONE – dein sicherer Weg nach Deutschland. Klickbarer MVP-Prototyp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one friendly column (max 980px). Home = next step + big service tiles. Bottom tab bar on phones, top tabs on desktop. */
:root{
  --bg:#F4F6F1; --surface:#FEFEFB; --sunken:#ECF0E9; --ink:#13213B; --muted:#586577; --line:#DDE4DA;
  --brand:#137A50; --brand-ink:#F5FAF6; --brand-soft:#DCF1E5;
  --sun:#F2B63D; --sun-ink:#1F1805; --sun-soft:#FCEFD0; --sun-text:#875800;
  --sky:#2A62AE; --sky-soft:#E1EBF8; --rose:#AE3658; --rose-soft:#F8E3EA;
  --teal:#0F757C; --teal-soft:#DAF0EF; --violet:#6647AD; --violet-soft:#ECE6F8;
  --danger:#B42318; --danger-soft:#FBE4E1;
  --hero:#13213B; --hero-ink:#F7F8F4; --hero-muted:#BAC6D8;
  --display:'Rubik','Segoe UI',Arial,sans-serif; --body:'Nunito','Segoe UI',Arial,sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(19,33,59,.05),0 8px 24px rgba(19,33,59,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --surface:#121D32; --sunken:#0E182A; --ink:#EAF0F7; --muted:#A0B0C6; --line:#23324E;
  --brand:#44D495; --brand-ink:#06150E; --brand-soft:#133A2B;
  --sun:#F2B63D; --sun-ink:#1F1805; --sun-soft:#3A2E10; --sun-text:#F2C766;
  --sky:#8DB9F3; --sky-soft:#16294A; --rose:#F29BB5; --rose-soft:#3D1826;
  --teal:#6FD6DA; --teal-soft:#0F3236; --violet:#BBA6F2; --violet-soft:#2A2046;
  --danger:#F7897D; --danger-soft:#3D1814;
  --hero:#172A4C; --hero-ink:#F7F8F4; --hero-muted:#BAC6D8; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#121D32; --sunken:#0E182A; --ink:#EAF0F7; --muted:#A0B0C6; --line:#23324E;
  --brand:#44D495; --brand-ink:#06150E; --brand-soft:#133A2B;
  --sun:#F2B63D; --sun-ink:#1F1805; --sun-soft:#3A2E10; --sun-text:#F2C766;
  --sky:#8DB9F3; --sky-soft:#16294A; --rose:#F29BB5; --rose-soft:#3D1826;
  --teal:#6FD6DA; --teal-soft:#0F3236; --violet:#BBA6F2; --violet-soft:#2A2046;
  --danger:#F7897D; --danger-soft:#3D1814;
  --hero:#172A4C; --hero-ink:#F7F8F4; --hero-muted:#BAC6D8; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,32px);line-height:1.2}
h2{font-size:20px;line-height:1.3}
h3{font-size:17px;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.label{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
svg{flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.logo{border:0;background:none;padding:0;font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--sun);font-family:var(--display);font-weight:700;font-size:14px;flex:none}
.spacer{flex:1}
.hbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;height:40px;min-width:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.hbtn .dotc{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#FFF8F6;border-radius:99px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.demo-chip{background:var(--sun-soft);color:var(--sun-text);border-color:transparent}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{padding:0}
  .tab{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:9px 2px 8px;border-bottom:0;border-top:3px solid transparent;min-width:0}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tab[aria-current="page"]{border-top-color:var(--brand)}
  main{padding-bottom:150px!important}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom,0px))!important}
  .hide-sm{display:none!important}
}
main{max-width:980px;margin:0 auto;padding:22px 16px 90px;display:flex;flex-direction:column;gap:22px}

/* building blocks */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0;color:inherit}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.grid>*,.grid2>*{min-width:0}
.pagehead{display:flex;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.back svg{transform:rotate(180deg)}
.lead{font-size:17px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:hover:not(:disabled),.btn.sun:hover:not(:disabled){filter:brightness(1.06)}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip:disabled{cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;flex-wrap:nowrap}
.wrapchips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.ok{background:var(--brand-soft);color:var(--brand)}
.warn{background:var(--sun-soft);color:var(--sun-text)}
.bad{background:var(--danger-soft);color:var(--danger)}
.info{background:var(--sky-soft);color:var(--sky)}
.neutral{background:var(--sunken);color:var(--muted)}
.note{border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.note svg{margin-top:2px}

input[type=text],input[type=number],input[type=search],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;min-height:46px}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:44px;min-height:52px;border-radius:16px;font-size:16px}

/* tone circles */
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.t-green{background:var(--brand-soft);color:var(--brand)} .t-sun{background:var(--sun-soft);color:var(--sun-text)}
.t-sky{background:var(--sky-soft);color:var(--sky)} .t-rose{background:var(--rose-soft);color:var(--rose)}
.t-teal{background:var(--teal-soft);color:var(--teal)} .t-violet{background:var(--violet-soft);color:var(--violet)}
.t-red{background:var(--danger-soft);color:var(--danger)} .t-grey{background:var(--sunken);color:var(--muted)}

/* hero / next step */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.hero .muted{color:var(--hero-muted)}
.hero .label{color:var(--sun)}
.hero .btn.ghost{color:var(--hero-ink);border-color:rgba(255,255,255,.32)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--hero);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.welcome{background:var(--sun-soft);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:var(--shadow);min-width:0;color:inherit}
.tile:hover{border-color:var(--muted)}
.tile b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25}
.tile span.muted{font-size:13.5px;line-height:1.35}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow,.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
button.li:first-child{border-top:0}
.chev{color:var(--muted);display:inline-flex;transition:transform .15s}

/* journey */
.phase{border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden}
.phase>button{width:100%;border:0;background:none;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;color:inherit}
.pnum{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:2px solid var(--line);color:var(--muted);flex:none}
.phase.done .pnum{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.phase.cur{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.phase.cur .pnum{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.phase .tasks{padding:0 16px 10px 70px}
@media (max-width:520px){.phase .tasks{padding-left:16px}}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task input{width:22px;height:22px;accent-color:var(--brand);margin-top:1px;flex:none}
.task.is-done label b{text-decoration:line-through;color:var(--muted)}

/* partner */
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#F7F8F4;flex:none}
.pcard{cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--muted)}
.stars{color:var(--sun-text);font-weight:800}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:700;min-width:0}

/* payment steps */
.steps{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.stp .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:800;position:relative;z-index:1}
.stp:not(:last-child)::before{content:"";position:absolute;left:12px;top:36px;bottom:-10px;width:2px;background:var(--line)}
.stp.released .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stp.proof .dot{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.bar{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden;display:flex}
.bar span{display:block;height:100%}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:2px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:5px}
.msg.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.composer{display:flex;gap:8px}
.composer input{flex:1}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:600}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:24px;max-width:540px;width:100%;max-height:calc(100% - 24px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
@media (max-width:560px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:92%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--sunken);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:inherit}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--surface);width:100%;text-align:left;color:inherit}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .radio{border:6px solid var(--brand)}
.big-ok{width:76px;height:76px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:4px auto 0}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--sunken);border-top-color:var(--brand);margin:20px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}

.fab{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;background:var(--hero);color:var(--hero-ink);padding:8px 18px 8px 8px;display:flex;align-items:center;gap:10px;font-weight:800;box-shadow:0 10px 26px rgba(6,12,24,.28)}
.fab .mark{width:38px;height:38px;border-radius:50%;background:var(--sun);color:var(--hero)}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 26px rgba(6,12,24,.28);display:flex;gap:8px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.drop.over{border-color:var(--brand);color:var(--brand)}
.ticket{background:linear-gradient(135deg,#13213B,#135A43);color:#F7F8F4;border-radius:22px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ticket canvas{background:#F7F8F4;border-radius:12px;padding:8px;width:132px;height:132px}
.fav[aria-pressed="true"]{color:var(--rose)}
.fav[aria-pressed="true"] svg path{fill:currentColor}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.prog span{display:block;height:100%;background:var(--sun);border-radius:99px}
.prog.light{background:var(--sunken)} .prog.light span{background:var(--brand)}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.chev{transition:none}}
</style>

function buildJourney(p){
 const driver=/fahrer|kraft|lkw|driver|haydovchi|водител/i.test(p.job);
 const T=k=>({id:k+"-"+Math.random().toString(36).slice(2,6),k,done:false});
 return [
  ["kyc","profile"],
  ["passport","diplomas",p.contract?"contract_up":"find_job",...(driver?["license_copy"]:[])],
  ["apostille","tr_diploma",...(driver?["tr_license"]:[]),...(p.married?["tr_marriage"]:[])],
  ["german_a2",p.goal==="training"?"training_contract":"recognition"],
  ["embassy","visa_ins","visa_docs"],
  ["flight","esim","transfer","packing"],
  ["anmeldung","bank","health_ins","dticket"],
  ["flat","liability","taxid",...(driver?["license_convert"]:[]),...(p.married?["family"]:[]),"german_b1"],
 ].map(ks=>ks.map(T));
}

  case "msgPartner": { const p=P(v); const ex=S.orders.find(o=>o.pid===v&&o.customer===S.profile.name); if(ex){go("order",ex.id);} else {S.chat.push({f:"them",t:[`Du hast eine Frage an ${p.name}? Schreib sie hier – ich leite sie weiter. Direkt schreiben kannst du nach einer Buchung.`,`${p.name}ga savolingiz bormi? Shu yerga yozing – yetkazaman. Buyurtmadan so‘ng to‘g‘ridan-to‘g‘ri yozishingiz mumkin.`,`Есть вопрос к ${p.name}? Напишите здесь — я передам. Напрямую можно писать после заказа.`,`Have a question for ${p.name}? Write it here and I’ll pass it on. You can message directly after booking.`],acts:[]}); modal=mAssistant;} break; }

  case "proofUp": { const [id,i]=v.split("|"),o=S.orders.find(x=>x.id===id); o.ms[+i].s="proof"; const ms=oMs(o); o.docs.push(`Nachweis_Schritt_${+i+1}.pdf`); o.msgs.push({f:"them",t:[`„${ms[+i].l}“ ist erledigt. Nachweis ist hochgeladen – bitte bestätigen.`,`«${ms[+i].l}» bajarildi. Dalil yuklandi – iltimos, tasdiqlang.`,`«${ms[+i].l}» выполнено. Подтверждение загружено — подтвердите, пожалуйста.`,`“${ms[+i].l}” is done. Proof uploaded – please confirm.`]}); if(o.customer===S.profile.name) notify("n_msg",{x:P(o.pid).name},["order",id]); toast(tr(["Gesendet. Der Kunde wird benachrichtigt.","Yuborildi. Mijozga xabar beriladi.","Отправлено. Клиент получит уведомление.","Sent. The customer will be notified."])); break; }
  case "disputeOpen": ui.dispOrder=v; ui.dispReason=null; modal=mDispute; break;
  case "dispReason": ui.dispReason=+v; break;
  case "reviewOpen": ui.rv={id:v,q:5,s:5,k:5,p:5}; modal=mReview; break;
  case "rate": { const [k,n]=v.split("|"); ui.rv[k]=+n; break; }
  case "amt": ui.money.amt=+v; break;
  case "pickProv": ui.money.best=+v; break;
  case "moneyNew": ui.money.step="calc"; break;
  case "simOrder": S.sim={id:v,steps:[false,false,false,false]}; notify("n_sim",null,["sim"]); toast(tr(["eSIM bestellt! Jetzt in 4 Schritten aktivieren.","eSIM buyurtma qilindi! Endi 4 qadamda faollashtiring.","eSIM заказана! Активируйте за 4 шага.","eSIM ordered! Activate it in 4 steps."])); window.scrollTo(0,0); break;
  case "simStep": S.sim.steps[+v]=el.checked; if(S.sim.steps.every(Boolean)) completeTaskKey("esim"); break;
  case "ticketBuy": modal=mTicket; break;
  case "ticketPay": S.dticket=true; modal=null; notify("n_ticket",null,["rail"]); completeTaskKey("dticket"); toast(tr(["Ticket gekauft. Gute Fahrt!","Chipta sotib olindi. Oq yo‘l!","Билет куплен. Счастливого пути!","Ticket bought. Have a good trip!"])); window.scrollTo(0,0); break;
  case "routeGo": ui.route.from=+document.getElementById("r-from").value; ui.route.to=+document.getElementById("r-to").value; ui.route.shown=true; break;
  case "swap": { const f=+document.getElementById("r-from").value, to=+document.getElementById("r-to").value; ui.route.from=to; ui.route.to=f; break; }
  case "insQ": { const [k,b]=v.split("|"); ui.ins[k]=b==="1"; break; }
  case "insReq": S.insReq[v]=true; notify("n_ins",{x:"InsurBridge Makler"},["partner","p8"]); toast(tr(["Anfrage gesendet. Antwort innerhalb von 24 Stunden.","So‘rov yuborildi. 24 soat ichida javob.","Запрос отправлен. Ответ в течение 24 часов.","Request sent. Reply within 24 hours."])); break;
  case "fav": S.fav[v]=!S.fav[v]; break;
  case "favOnly": ui.favOnly=el.checked; break;
  case "houseAsk": modal=()=>mHouse(v); break;
  case "topic": ui.learnTopic=v; break;
  case "speak": try{ const u=new SpeechSynthesisUtterance(v); u.lang="de-DE"; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(err){ toast(tr(["Audio ist auf diesem Gerät nicht verfügbar.","Bu qurilmada audio mavjud emas.","Звук недоступен на этом устройстве.","Audio isn’t available on this device."])); render(); } return;
  case "quiz": { const [i,k]=v.split("|").map(Number); if(S.quiz[i]==null){ S.quiz[i]=k; if(k===QUIZ[i].a&&!S.quizPaid?.[i]){ S.quizPaid=S.quizPaid||{}; S.quizPaid[i]=true; addPts(20,"h_quiz"); toast("+20 "+t("points")); } } break; }
  case "quizReset": S.quiz={}; break;
  case "pack": S.pack[+v]=el.checked; if(PACK.every((_,i)=>S.pack[i])) completeTaskKey("packing"); break;
  case "docDel": S.docs.splice(+v,1); break;
  case "redeem": { const r=REWARDS.find(x=>x.id===v); if(S.points>=r.c){ S.points-=r.c; S.hist.unshift({k:"h_redeem",v:{x:r.n},n:-r.c}); S.redeemed.push(r.id); notify("h_redeem",{x:r.n},["points"]); toast(tr(["Eingelöst! Den Gutschein findest du in deinen Mitteilungen.","Almashtirildi! Kupon bildirishnomalarda.","Получено! Купон в уведомлениях.","Redeemed! The voucher is in your notifications."])); } break; }
  case "copy": { const ok=()=>{toast(t("copied")+": "+v);render();}; try{ navigator.clipboard.writeText(v).then(ok,()=>{toast(v);render();}); }catch(err){ toast(v); render(); } return; }
  case "editProfile": modal=mProfile; break;
  case "pref": S.prefs[v]=el.checked; toast(t("saved")); break;
  case "reset": S=seed(); ui.cat="all"; ui.q=""; modal=null; toast(t("reset_done")); window.scrollTo(0,0); break;
  case "pTab": ui.pTab=v; break;
  case "aTab": ui.aTab=v; break;
  case "reqAccept": { const r=S.pReq.find(x=>x.id===v); r.state="accepted"; const s=SV("p4",r.sid); const id="GTA-"+(10600+S.orders.length); S.orders.unshift({id,pid:"p4",sid:r.sid,price:s.price,created:new Date().toISOString().slice(0,10),customer:r.customer,dispute:false,reviewed:false,ms:s.ms.map(()=>({s:"held"})),docs:[],msgs:[{f:"me",t:r.note}]}); toast(tr(["Angenommen. Auftrag ist angelegt.","Qabul qilindi. Buyurtma yaratildi.","Принято. Заказ создан.","Accepted. Order created."])); break; }
  case "reqDecline": S.pReq.find(x=>x.id===v).state="declined"; toast(tr(["Abgelehnt. Der Kunde wird informiert.","Rad etildi. Mijozga xabar beriladi.","Отклонено. Клиент будет уведомлён.","Declined. The customer will be informed."])); break;
  case "pause": S.paused[v]=!S.paused[v]; toast(t("saved")); break;
  case "reverify": S.reverified=true; toast(tr(["Unterlagen gesendet. GTA prüft sie.","Hujjatlar yuborildi. GTA tekshiradi.","Документы отправлены. GTA проверит.","Documents sent. GTA will review them."])); break;
  case "pStatus": { const [id,st]=v.split("|"),p=P(id); p.status=st; if(st==="active"&&!p.trust) p.trust=72; toast(`${p.name}: ${st==="active"?tr(["freigegeben","tasdiqlandi","одобрен","approved"]):st==="rejected"?tr(["abgelehnt","rad etildi","отклонён","rejected"]):tr(["gesperrt","bloklandi","заблокирован","suspended"])}`); break; }
  case "resolve": { const [id,how]=v.split("|"),o=S.orders.find(x=>x.id===id); o.dispute=false;
    if(how==="release") o.ms.forEach(m=>m.s="released");
    else { const ms=oMs(o); const kept=ms.filter(m=>m.s==="released"); o.price=kept.reduce((a,m)=>a+m.a,0); o.ms=o.ms.filter(m=>m.s==="released"); if(!o.ms.length) o.ms=[{s:"released"}]; o.refunded=true; }
    toast(how==="refund"?tr(["Kunde erstattet","Mijozga qaytarildi","Клиенту возвращено","Customer refunded"]):tr(["Anbieter ausgezahlt","Hamkorga to‘landi","Партнёру выплачено","Provider paid"])); break; }
  case "rev": { const [i,ok]=v.split("|"); S.reviews[+i].ok=ok==="1"; toast(t("saved")); break; }
  default: return;
 }
 render();
});

document.addEventListener("input",e=>{
 const el=e.target;
 if(el.id==="q"){ui.q=el.value;render();}
 if(el.id==="amt"){ui.money.amt=el.value;render();}
 if(el.id==="maxRent"){ui.maxRent=+el.value;render();}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.level){P(el.dataset.level).level=el.value;toast(t("saved"));render();}
 if(el.dataset.price){const s=SV("p4",el.dataset.price);s.price=Math.max(0,+el.value||0);toast(t("saved"));render();}
 if(el.id==="docFile"){[...el.files].forEach(f=>S.docs.push({n:f.name,s:"check"}));completeTaskKey("kyc");toast(tr(["Hochgeladen. GTA prüft das Dokument.","Yuklandi. GTA hujjatni tekshiradi.","Загружено. GTA проверит документ.","Uploaded. GTA will check the document."]));render();}
 if(el.id==="orderFile"){const o=S.orders.find(x=>x.id===el.dataset.order);[...el.files].forEach(f=>o.docs.push(f.name));toast(tr(["Dokument hinzugefügt","Hujjat qo‘shildi","Документ добавлен","Document added"]));render();}
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over");}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest(".drop");if(d)d.classList.remove("over");});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest(".drop");if(!d)return;e.preventDefault();const files=[...e.dataTransfer.files];const inp=d.querySelector("input");if(inp&&inp.id==="orderFile"){const o=S.orders.find(x=>x.id===inp.dataset.order);files.forEach(f=>o.docs.push(f.name));}else files.forEach(f=>S.docs.push({n:f.name,s:"check"}));toast(t("saved"));render();});

document.addEventListener("submit",e=>{
 e.preventDefault(); const f=e.target, val=id=>(f.querySelector("#"+id)||{}).value||"";
 if(f.id==="msgForm"){const txt=val("msgIn").trim();if(!txt)return;const o=S.orders.find(x=>x.id===f.dataset.order),asP=f.dataset.as==="p";o.msgs.push({f:asP?"them":"me",t:txt});
  if(/\bbar\b|cash|naqd|налич|whatsapp|telegram/i.test(txt)) o.msgs.push({f:"sys",t:["Hinweis von GTA: Zahlungen außerhalb von GTA ONE sind nicht geschützt.","GTA eslatmasi: GTA ONE’dan tashqaridagi to‘lovlar himoyalanmagan.","Напоминание GTA: платежи вне GTA ONE не защищены.","GTA note: payments outside GTA ONE are not protected."]});
  else if(!asP) setTimeout(()=>{o.msgs.push({f:"them",t:["Danke! Wir antworten dir so schnell wie möglich.","Rahmat! Imkon qadar tez javob beramiz.","Спасибо! Ответим как можно скорее.","Thanks! We’ll reply as soon as possible."]});render();},1300);}
 if(f.id==="askForm"){const q=val("askIn").trim();if(!q)return;ask(q);}
 if(f.id==="dispForm"){if(ui.dispReason==null)return;const o=S.orders.find(x=>x.id===ui.dispOrder);
  o.dispute=true;o.disputeText=tr(REASONS[ui.dispReason])+(val("dispText").trim()?": "+val("dispText").trim():"");o.msgs.push({f:"sys",t:["Problem gemeldet. Offene Beträge sind eingefroren.","Muammo bildirildi. Ochiq summalar muzlatildi.","Проблема отправлена. Суммы заморожены.","Problem reported. Open amounts are frozen."]});modal=null;toast(tr(["Gemeldet. GTA kümmert sich darum.","Yuborildi. GTA shug‘ullanadi.","Отправлено. GTA займётся этим.","Reported. GTA is on it."]));}
 if(f.id==="revForm"){const o=S.orders.find(x=>x.id===ui.rv.id),r=ui.rv,avg=Math.round((r.q+r.s+r.k+r.p)/4);S.reviews.unshift({pid:o.pid,by:S.profile.name,stars:avg,text:val("revText").trim()||"—",ok:true});o.reviewed=true;addPts(50,"h_review",{x:P(o.pid).name});modal=null;toast(tr(["Danke! +50 Punkte","Rahmat! +50 ball","Спасибо! +50 баллов","Thank you! +50 points"]));}
 if(f.id==="moneyForm"){const m=ui.money,amt=Math.max(0,+m.amt||0);if(amt<10){toast(tr(["Bitte mindestens 10 € eingeben.","Kamida 10 € kiriting.","Введите минимум 10 €.","Please enter at least €10."]));render();return;}const o=PROVIDERS[m.best];const get=Math.max(0,Math.round((amt-o.fee)*o.rate));m.name=val("m-name");m.last=val("m-last");
  S.transfers.unshift({r:m.name,amt,get,code:"TX-"+Math.floor(100000+Math.random()*899999)});notify("n_sent",{x:eur(amt),r:m.name},["money"]);m.step="done";window.scrollTo(0,0);}
 if(f.id==="profForm"){const p=S.profile;p.name=val("pf-name").trim()||p.name;p.job=val("pf-job").trim()||p.job;p.city=val("pf-city").trim()||p.city;p.goal=val("pf-goal");p.contract=f.querySelector("#pf-contract").checked;p.married=f.querySelector("#pf-married").checked;
  const old=new Set(flat().filter(x=>x.done).map(x=>x.k));S.journey=buildJourney(p);flat().forEach(x=>{if(old.has(x.k))x.done=true;});completeTaskKey("profile");modal=null;toast(t("saved"));}
 if(f.id==="houseForm"){S.houseReq[f.dataset.id]=true;modal=null;toast(tr(["Anfrage gesendet","So‘rov yuborildi","Запрос отправлен","Enquiry sent"]));setTimeout(()=>{notify("n_house",null,["housing"]);render();},3500);}
 if(f.id==="svcForm"){P("p4").services.push({id:"s"+Date.now(),n:val("sf-name").trim(),price:+val("sf-price")||0,days:+val("sf-days")||1});toast(tr(["Angelegt. Wartet auf GTA-Freigabe.","Qo‘shildi. GTA tasdig‘ini kutmoqda.","Добавлено. Ждёт одобрения GTA.","Added. Awaiting GTA approval."]));}
 render();
});

render();
})();
