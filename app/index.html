<style>
/* Layout: sticky brand bar + tab bar (bottom on phones), one content column up to 1080px; cards only for objects the user acts on */
:root{
  --bg:#EEF2EE; --surface:#FBFCFA; --sunken:#E3E9E3; --ink:#0E1B33; --muted:#51607A; --line:#D5DDD5;
  --brand:#157A52; --brand-ink:#F4F8F5; --brand-soft:#D8EDE2;
  --gold:#94620A; --gold-soft:#FAEBC8; --gold-fill:#E8B84A;
  --info:#2358A0; --info-soft:#DDE8F6; --danger:#B42318; --danger-soft:#FBE3E0;
  --hero:#0E1B33; --hero-ink:#F4F6F2; --hero-muted:#B9C6D8;
  --display:'Sora', 'Segoe UI', Arial, sans-serif; --body:'DM Sans', 'Segoe UI', Arial, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(14,27,51,.06), 0 6px 20px rgba(14,27,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#111D33; --sunken:#0D182B; --ink:#E8EEF6; --muted:#9DAEC6; --line:#223252;
  --brand:#3DD68C; --brand-ink:#06150E; --brand-soft:#123A2B;
  --gold:#E8B84A; --gold-soft:#3A2E10; --gold-fill:#E8B84A;
  --info:#86B6F2; --info-soft:#15294A; --danger:#F7897D; --danger-soft:#3D1814;
  --hero:#16284A; --hero-ink:#F4F6F2; --hero-muted:#B9C6D8; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111D33; --sunken:#0D182B; --ink:#E8EEF6; --muted:#9DAEC6; --line:#223252;
  --brand:#3DD68C; --brand-ink:#06150E; --brand-soft:#123A2B;
  --gold:#E8B84A; --gold-soft:#3A2E10; --gold-fill:#E8B84A;
  --info:#86B6F2; --info-soft:#15294A; --danger:#F7897D; --danger-soft:#3D1814;
  --hero:#16284A; --hero-ink:#F4F6F2; --hero-muted:#B9C6D8; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,4vw,34px);line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--hero-ink)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--gold-fill);color:#0E1B33;font-style:normal;font-size:13px}
.spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--hero-muted);padding:5px 9px;border-radius:7px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--hero-ink);color:#0E1B33}
.pts{display:flex;align-items:center;gap:6px;background:rgba(232,184,74,.16);color:#F3D48A;border:0;border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab svg{width:18px;height:18px}
@media (max-width:720px){
  .top{position:static}
  .top-in{gap:8px}
  .seg button{padding:4px 7px;font-size:12px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{padding:0;justify-content:space-around}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px 7px;border-bottom:0;border-top:3px solid transparent;flex:1}
  .tab[aria-current="page"]{border-top-color:var(--brand)}
  main{padding-bottom:96px!important}
  .dila-fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
}

main{max-width:1080px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid2>*,.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.section{display:flex;flex-direction:column;gap:14px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:#0E1B33}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.v{background:var(--brand-soft);color:var(--brand)}
.pill.vp{background:var(--info-soft);color:var(--info)}
.pill.co{background:var(--gold-soft);color:var(--gold)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.neutral{background:var(--sunken);color:var(--muted)}
.sample{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:24px;display:grid;gap:20px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);position:relative;overflow:hidden}
.hero .muted{color:var(--hero-muted)}
.hero .eyebrow{color:#3DD68C}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.meter{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.meter>span{display:block;height:100%;background:linear-gradient(90deg,#3DD68C,#E8B84A);border-radius:99px}
.now{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.now .btn{background:transparent;border-color:rgba(255,255,255,.3);color:var(--hero-ink)}
.now .btn.gold{background:var(--gold-fill);color:#0E1B33;border-color:var(--gold-fill)}

/* journey rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:92px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;text-align:center;border-radius:10px}
.step b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font-family:var(--display);font-size:15px;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.step.done b{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.cur b{background:var(--gold-fill);border-color:var(--gold-fill);color:#0E1B33}
.step span{font-size:12px;font-weight:600;line-height:1.25;color:var(--muted)}
.step.cur span,.step.done span{color:var(--ink)}
.step[aria-pressed="true"]{background:var(--sunken)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:20px;height:20px;accent-color:var(--brand);margin-top:1px;flex:none}
.task.is-done .t{text-decoration:line-through;color:var(--muted)}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

/* partner */
.pcard{cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#F4F6F2;flex:none}
.stars{color:var(--gold);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.svc{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}

/* milestones */
.ms{display:flex;flex-direction:column;gap:0}
.ms-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ms-row:first-child{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);justify-self:center}
.dot.released{background:var(--brand);border-color:var(--brand)}
.dot.proof{background:var(--gold-fill);border-color:var(--gold-fill)}
.dot.held{background:var(--surface);border-color:var(--info)}
.bar{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden;display:flex}
.bar span{display:block;height:100%}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding:4px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px}
.composer{display:flex;gap:8px}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}

.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal header{display:flex;justify-content:space-between;align-items:start;gap:12px}
.x{border:0;background:var(--sunken);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}

/* dila */
.dila-fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;background:var(--hero);color:var(--hero-ink);padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:0 8px 24px rgba(6,12,24,.25)}
.dila-face{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3DD68C,#145C43);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#F4F6F2;flex:none}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:linear-gradient(135deg,#16284A,#145C43);display:grid;place-items:center;color:#F4F6F2;position:relative;overflow:hidden}
.video .play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.video .langs{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;letter-spacing:.08em}
.video .dur{position:absolute;right:10px;bottom:8px;font-size:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(6,12,24,.25)}
.notice{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 12px;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--brand);color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.card,.btn,.chip{transition:border-color .15s,filter .15s}}
</style>

/* ---------- Dila ---------- */
function dilaAnswer(q){
 const s=q.toLowerCase(), ci=curPhase(), open=S.journey[ci].tasks.filter(x=>!x.done);
 if(/fehlt|nächst|next|nima|что|todo|was muss/.test(s)) return `Du bist in Phase ${ci+1}: ${S.journey[ci].name}. Offen sind:\n${open.map(x=>"• "+x.t).join("\n")}\nIch kann dir passende geprüfte Partner zeigen.`;
 if(/apostil/.test(s)) return "Apostille: 1) Original zum Justizorgan bzw. über einen Notar einreichen. 2) Nach ca. 5 Werktagen abholen. 3) Erst danach übersetzen lassen, damit die Apostille mitübersetzt wird. Apostil Markazi macht das ab 35 € mit SafePay.";
 if(/sim|esim|handy|telefon/.test(s)) return "Am einfachsten ist eine eSIM vor dem Abflug. Services → SIM & eSIM zeigt drei Tarife und die Aktivierung in 4 Schritten.";
 if(/anmeld|bürgeramt|wohnsitz/.test(s)) return `Die Wohnsitzanmeldung in ${S.profile.city} muss innerhalb von 14 Tagen nach dem Einzug erfolgen. Du brauchst Reisepass, Visum und die Wohnungsgeberbestätigung vom Vermieter.`;
 if(/flughafen|airport|flug|einreise/.test(s)) return "Ins Handgepäck: Reisepass mit Visum, Arbeitsvertrag, Versicherungsnachweis, Adresse der ersten Unterkunft, etwas Bargeld in Euro. Medikamente mit Rezept auf Englisch.";
 if(/geld|money|pul|перевод|wechsel/.test(s)) return "Vergleiche immer den Betrag, der ankommt. Unter Services → Geld & Wechsel siehst du drei Anbieter im Vergleich. Nutze keine privaten Wechsler.";
 if(/punkt|point|ball|балл/.test(s)) return `Du hast ${S.points.toLocaleString("de-DE")} Punkte (Status ${tier(S.points)}). Einlösen kannst du sie unter Konto → Punkte.`;
 if(/betrug|seriös|fake|scam|agentur/.test(s)) return "Warnsignale: garantiertes Visum, nur Barzahlung, kein Vertrag, Druck zur schnellen Zahlung. Auf GTA ONE zahlst du nur über SafePay, und das Geld geht erst nach Leistung an den Partner.";
 return "Das kann ich im Prototyp noch nicht genau beantworten. Frag mich nach: Was fehlt mir noch? · Apostille · SIM · Anmeldung · Flughafen · Geld senden · Betrug erkennen.";
}

/* ---------- shell ---------- */
function render(){
 const role=S.role;
 const tabs=role==="user"?[["journey",t("journey")],["market",t("market")],["services",t("services")],["orders",t("orders")],["account",t("account")]]:[];
 let body="";
 if(role==="user") body=({journey:vJourney,market:vMarket,services:vServices,orders:()=>vOrders(false),account:vAccount})[S.view]();
 else if(role==="partner") body=vPartnerPortal();
 else body=vAdmin();
 const app=document.getElementById("app");
 const focusId=document.activeElement&&document.activeElement.id, selStart=document.activeElement&&document.activeElement.selectionStart;
 app.innerHTML=`
 <header class="top"><div class="top-in">
  <div class="logo"><i>G</i>GTA ONE</div>
  <div class="spacer"></div>
  ${role==="user"?`<button class="pts" data-a="acct" data-v="points" aria-label="${t("points")}">★ <span class="num">${S.points.toLocaleString("de-DE")}</span></button>`:""}
  <div class="seg" role="group" aria-label="Sprache">${["uz","ru","de","en"].map(l=>`<button data-a="lang" data-v="${l}" aria-pressed="${S.lang===l}">${l.toUpperCase()}</button>`).join("")}</div>

 ${tabs.length?`<nav class="tabs" aria-label="Hauptnavigation"><div class="tabs-in">${tabs.map(([k,n])=>`<button class="tab" data-a="view" data-v="${k}" ${S.view===k?'aria-current="page"':""}>${ico(k)}<span>${n}</span></button>`).join("")}</div></nav>`:""}
 <main>${t("lang_note")?`<p class="notice">${t("lang_note")}</p>`:""}${body}</main>
 ${role==="user"?`<button class="dila-fab" data-a="dila"><span class="dila-face">D</span>${t("ask_dila")}</button>`:""}
 ${modal?`<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true">${modal()}</div></div>`:""}
 ${toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:""}`;
 document.documentElement.lang=S.lang;
 const c=document.getElementById("chat")||null; if(c) c.scrollTop=c.scrollHeight;

 if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart,selStart); }catch(e){} } }
 save();
}

function go(view){ S.view=view; ui.partnerId=null; ui.orderId=null; modal=null; window.scrollTo(0,0); }

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]"); if(!el) return;
 const a=el.dataset.a, v=el.dataset.v||"";
 if(a==="scrim"&&e.target!==el) return;
 if(el.tagName==="INPUT"&&el.type==="checkbox"&&a!=="task"&&a!=="pro"&&a!=="usePts") return;
 switch(a){
  case "view": go(v); break;
  case "lang": S.lang=v; break;
  case "role": S.role=v; ui.orderId=null; ui.partnerId=null; modal=null; if(v==="user") S.view=S.view||"journey"; break;
  case "phase": S.selPhase=+v; break;
  case "task": { const before=S.journey.map(phaseDone); S.journey.forEach(ph=>ph.tasks.forEach(x=>{ if(x.id===v) x.done=el.checked; })); S.journey.forEach((ph,i)=>{ if(!before[i]&&phaseDone(ph)){ addPoints(100,`Phase ${i+1} abgeschlossen`); toast(`Phase ${i+1} geschafft! +100 Punkte`); S.selPhase=null; } }); break; }
  case "goCat": go("market"); ui.cat=v; break;
  case "cat": ui.cat=v; break;
  case "pro": ui.pro=el.checked; break;
  case "partner": S.role="user"; S.view="market"; ui.partnerId=v; modal=null; window.scrollTo(0,0); break;
  case "back": ui.partnerId=null; break;
  case "book": { const [pid,sid]=v.split("|"); ui.usePts=false; modal=()=>bookingModal(pid,sid); break; }
  case "usePts": { ui.usePts=el.checked; const m=modal; modal=m; break; }
  case "pay": { const [pid,sid]=v.split("|"), p=P(pid), s=p.services.find(x=>x.id===sid);
   const maxDisc=Math.min(Math.floor(S.points/100),Math.floor(s.price*0.1)), disc=ui.usePts?maxDisc:0;
   if(disc){ S.points-=disc*100; S.earned.unshift([`Rabatt ${s.name}`,-disc*100]); }
   const ms=(s.ms||[["Leistung",100]]).map(([l,pc])=>({l,a:Math.round(s.price*pc/100),s:"held"}));
   const id="GTA-"+(10600+S.orders.length);
   S.orders.unshift({id,pid,title:s.name,price:s.price,created:new Date().toISOString().slice(0,10),customer:S.profile.name,dispute:false,reviewed:false,ms,docs:[],msgs:[{f:"sys",t:`Bezahlt: ${eur(s.price-disc)} liegen in Treuhand.`},{f:"them",t:`Salom ${S.profile.name}, danke für Ihre Buchung! Wir melden uns innerhalb von 24 Stunden.`}]});
   const earn=Math.round(s.price-disc); if(earn>0) addPoints(earn,`Buchung ${s.name}`);
   modal=null; S.view="orders"; ui.partnerId=null; ui.orderId=id; toast(`Bezahlt. Geld liegt sicher in Treuhand. +${earn} Punkte`); break; }
  case "close": case "scrim": modal=null; break;
  case "order": ui.orderId=v; window.scrollTo(0,0); break;
  case "backOrders": ui.orderId=null; break;
  case "release": { const [id,i]=v.split("|"), o=S.orders.find(x=>x.id===id); o.ms[+i].s="released"; o.msgs.push({f:"sys",t:`Meilenstein „${o.ms[+i].l}“ bestätigt. ${eur(o.ms[+i].a)} an den Partner ausgezahlt.`}); toast("Freigegeben. Der Partner erhält die Zahlung."); break; }
  case "proofUp": { const [id,i]=v.split("|"), o=S.orders.find(x=>x.id===id); o.ms[+i].s="proof"; o.docs.push(`Nachweis_${o.ms[+i].l.replace(/\s+/g,"-")}.pdf`); o.msgs.push({f:"them",t:`Nachweis für „${o.ms[+i].l}“ ist hochgeladen. Bitte prüfen und bestätigen.`}); toast("Nachweis gesendet. Der Kunde wird benachrichtigt."); break; }
  case "disputeOpen": modal=()=>`<header><div><p class="eyebrow" style="color:var(--danger)">${t("dispute")}</p><h2>Was ist passiert?</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header><form id="dispForm" data-order="${v}" style="display:flex;flex-direction:column;gap:12px"><label class="f">Beschreibung<textarea id="dispText" rows="4" required placeholder="z. B. Leistung nicht erbracht, Partner antwortet nicht"></textarea></label><p class="notice">Offene Beträge werden sofort eingefroren. GTA meldet sich innerhalb von 48 Stunden.</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">${t("cancel")}</button><button class="btn danger">Beschwerde senden</button></div></form>`; break;
  case "reviewOpen": ui.rv={id:v,q:5,s:5,p:5,k:5}; modal=reviewModal; break;
  case "rate": { const [k,n]=v.split("|"); ui.rv[k]=+n; break; }
  case "svcTab": ui.svcTab=v; break;
  case "affiliate": toast(`Weiter zum Anbieter: ${v} (im Prototyp simuliert)`); break;
  case "redeemGo": go("account"); ui.acct="points"; break;
  case "acct": S.role="user"; go("account"); ui.acct=v; break;
  case "redeem": { const [n,c]=v.split("|"); if(S.points>=+c){ S.points-=+c; S.earned.unshift([`Eingelöst: ${n}`,-c]); S.redeemed.push(n); toast(`Eingelöst: ${n}. Gutschein kommt per E-Mail.`);} break; }
  case "copy": { const done=()=>toast("Code kopiert"); try{ navigator.clipboard.writeText(v).then(done,()=>toast(`Code: ${v}`)); }catch(err){ toast(`Code: ${v}`);} break; }
  case "video": { const [n,d]=VIDEOS[+v]; modal=()=>`<header><div><p class="eyebrow">Dila AI · ${d}</p><h2>${esc(n)}</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header><div class="video"><div class="dila-face" style="width:96px;height:96px;font-size:36px">D</div><span class="langs">UZ · RU · DE · EN</span></div><p class="muted small">Platzhalter. Im Produkt: KI-Avatar-Video mit Untertiteln in vier Sprachen.</p><p>${esc(dilaAnswer(n))}</p>`; break; }
  case "dila": modal=dilaPanel; break;
  case "dilaAsk": S.dila.push({f:"me",t:v},{f:"them",t:dilaAnswer(v)}); modal=dilaPanel; break;
  case "restart": S.onboarded=false; go("journey"); break;
  case "reset": S=seedState(); ui.cat="all"; go("journey"); toast("Demo zurückgesetzt"); break;
  case "adminTab": ui.adminTab=v; break;
  case "pStatus": { const [id,st]=v.split("|"), p=P(id); p.status=st; if(st==="active"&&!p.trust){p.trust=70;} toast(`${p.name}: ${st==="active"?"freigegeben":"gesperrt"}`); break; }
  case "resolve": { const [id,how]=v.split("|"), o=S.orders.find(x=>x.id===id); o.dispute=false; o.ms.forEach(m=>{ if(m.s!=="released") m.s=how==="release"?"released":"refunded"; }); if(how==="refund"){ o.ms=o.ms.filter(m=>m.s!=="refunded"); o.price=o.ms.reduce((a,m)=>a+m.a,0); } toast(how==="refund"?"Kunde erstattet":"An Partner ausgezahlt"); break; }
  case "rev": { const [i,ok]=v.split("|"); S.reviews[+i].ok=ok==="1"; toast(ok==="1"?"Veröffentlicht":"Ausgeblendet, Partner zur Prüfung markiert"); break; }
  default: return;
 }
 render();
});

function reviewModal(){
 const crit=[["q","Qualität"],["s","Geschwindigkeit"],["p","Preis-Leistung"],["k","Kommunikation"]];
 return `<header><div><p class="eyebrow">Verified Purchase</p><h2>Wie war die Leistung?</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header>
 ${crit.map(([k,n])=>`<div class="row" style="justify-content:space-between"><span>${n}</span><span class="row" style="gap:2px">${[1,2,3,4,5].map(i=>`<button class="x" style="background:none;width:30px;height:30px;color:${i<=ui.rv[k]?"var(--gold)":"var(--line)"}" data-a="rate" data-v="${k}|${i}" aria-label="${n} ${i} von 5">★</button>`).join("")}</span></div>`).join("")}
 <form id="revForm" style="display:flex;flex-direction:column;gap:12px"><label class="f">Kommentar<textarea id="revText" rows="3" placeholder="Was lief gut, was nicht?"></textarea></label><div class="row" style="justify-content:flex-end"><button class="btn primary">Bewertung senden (+50 ${t("points")})</button></div></form>`;
}

document.addEventListener("input",e=>{
 if(e.target.id==="q"){ ui.q=e.target.value; render(); }
 if(e.target.id==="amt"){ ui.amount=e.target.value; render(); }
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.id==="dir"){ ui.dir=el.value; render(); }
 if(el.dataset.a==="level"){ P(el.dataset.v).level=el.value; toast("Stufe geändert"); render(); }
 if(el.id==="docFile"){ [...el.files].forEach(f=>S.docs.push({n:f.name,s:"hochgeladen"})); toast("Datei hinzugefügt. GTA prüft das Dokument."); render(); }
 if(el.id==="orderFile"){ const o=S.orders.find(x=>x.id===el.dataset.order); [...el.files].forEach(f=>o.docs.push(f.name)); toast("Dokument zum Auftrag hinzugefügt"); render(); }
});
document.addEventListener("dragover",e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave",e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop",e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d){ e.preventDefault(); [...e.dataTransfer.files].forEach(f=>S.docs.push({n:f.name,s:"hochgeladen"})); toast("Datei hinzugefügt. GTA prüft das Dokument."); render(); } });

document.addEventListener("submit",e=>{
 e.preventDefault(); const f=e.target;
 if(f.id==="onb"){
  const g=n=>f.elements[n].value;
  S.profile={name:g("name").trim()||"Gast",age:+g("age")||30,country:g("country"),goal:g("goal"),job:g("job").trim()||"Fachkraft",city:g("city").trim()||"Berlin",contract:g("contract")==="1",married:g("married")==="1",visa:false};
  S.journey=buildJourney(S.profile); S.onboarded=true; S.selPhase=null; S.dila=[{f:"them",t:`Salom ${S.profile.name}! Deine Journey ist fertig. Frag mich: Was fehlt mir noch?`}];
  toast("Deine persönliche Journey ist erstellt");
 }
 if(f.id==="msgForm"){
  const inp=f.querySelector("input"), txt=inp.value.trim(); if(!txt) return;
  const o=S.orders.find(x=>x.id===f.dataset.order), asP=f.dataset.as==="partner";
  o.msgs.push({f:asP?"them":"me",t:txt});
  if(/bar|cash|whatsapp|telegram|naqd|налич/i.test(txt)) o.msgs.push({f:"sys",t:"Hinweis von GTA: Zahlungen außerhalb von SafePay sind nicht geschützt."});
  else if(!asP) setTimeout(()=>{ o.msgs.push({f:"them",t:"Danke, wir haben Ihre Nachricht erhalten und antworten in Kürze."}); render(); },1200);
 }
 if(f.id==="dilaForm"){ const q=f.querySelector("input").value.trim(); if(!q) return; S.dila.push({f:"me",t:q},{f:"them",t:dilaAnswer(q)}); modal=dilaPanel; }
 if(f.id==="dispForm"){ const o=S.orders.find(x=>x.id===f.dataset.order); o.dispute=true; o.disputeText=f.querySelector("textarea").value.trim(); o.msgs.push({f:"sys",t:"Beschwerde eröffnet. Offene Beträge sind eingefroren."}); modal=null; toast("Beschwerde gesendet. GTA prüft innerhalb von 48 Stunden."); }
 if(f.id==="revForm"){ const o=S.orders.find(x=>x.id===ui.rv.id), r=ui.rv, avg=Math.round((r.q+r.s+r.p+r.k)/4);
  S.reviews.unshift({pid:o.pid,by:S.profile.name,stars:avg,text:f.querySelector("textarea").value.trim()||"Ohne Kommentar",ok:true}); o.reviewed=true; addPoints(50,`Bewertung ${P(o.pid).name}`); modal=null; toast("Danke! +50 Punkte"); }
 if(f.id==="svcForm"){ const me=P("p4"); me.services.push({id:"s"+Date.now(),name:f.querySelector("#sf-name").value.trim(),price:+f.querySelector("#sf-price").value||0,days:+f.querySelector("#sf-days").value||1}); toast("Leistung angelegt. Wartet auf GTA-Freigabe."); }
 render();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&modal){ modal=null; render(); } });

render();
})();
</script>
